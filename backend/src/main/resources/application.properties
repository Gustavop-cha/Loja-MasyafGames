spring.application.name=masyaf-games-api
server.port=8080

# Lê as credenciais do arquivo backend/.env (não versionado). Veja backend/.env.example
spring.config.import=optional:file:.env[.properties]

# ===== Banco de dados: Neon (PostgreSQL serverless) =====
# DB_URL no formato JDBC: jdbc:postgresql://ep-xxxx.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masyaf_games}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: o plano gratuito do Neon limita conexões e "hiberna" o banco quando ocioso
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Popula o catálogo (data.sql) depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Mensagens de erro legíveis para o frontend
server.error.include-message=always

# ===== Administração =====
# E-mail do único usuário com acesso à área Admin (definido em backend/.env)
app.admin-email=${ADMIN_EMAIL:}
